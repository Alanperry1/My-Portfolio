<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <!-- sparkle filter -->
    <filter id="sparkle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="24" fill="#1a0533"/>
  <!-- Bold G shape -->
  <path d="
    M155 65
    A65 65 0 1 0 155 135
    L115 135
    L115 108
    L148 108
    A38 38 0 1 1 148 92
    L155 92 Z
  " fill="url(#glow)" filter="url(#sparkle)"/>
  <!-- Sparkle dots -->
  <circle cx="60"  cy="50"  r="2.5" fill="white" opacity="0.9"/>
  <circle cx="150" cy="45"  r="1.5" fill="white" opacity="0.7"/>
  <circle cx="170" cy="80"  r="2"   fill="white" opacity="0.8"/>
  <circle cx="40"  cy="140" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="130" cy="165" r="2"   fill="white" opacity="0.7"/>
  <circle cx="80"  cy="30"  r="1"   fill="white" opacity="0.5"/>
  <circle cx="165" cy="150" r="1.5" fill="white" opacity="0.6"/>
</svg>
